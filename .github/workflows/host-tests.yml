name: Host sketch characterization
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile and run actual sketch with no-actuation test doubles
        run: sh tests/host/run.sh
